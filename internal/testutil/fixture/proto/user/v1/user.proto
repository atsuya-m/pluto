syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
}

message Address {
  string country = 1;
  string city = 2;
}

message Profile {
  string bio = 1;
  string avatar_url = 2;
  Address address = 3;
}

message User {
  string id = 1;
  string name = 2;
  optional string nickname = 3;
  optional int32 age = 4;
  UserStatus status = 5;
  repeated string tags = 6;
  Profile profile = 7;
  map<string, string> labels = 8;
  oneof contact {
    string email = 9;
    string phone = 10;
  }
  bool admin = 11;
  google.protobuf.Timestamp create_time = 12;
}

message CreateUserRequest {
  string name = 1;
  optional string nickname = 2;
  optional int32 age = 3;
  UserStatus status = 4;
  repeated string tags = 5;
  Profile profile = 6;
  map<string, string> labels = 7;
  oneof contact {
    string email = 8;
    string phone = 9;
  }
  optional bool admin = 10;
  repeated Address addresses = 11;
  map<int32, string> scores = 12;
  map<string, Address> places = 13;
  repeated UserStatus history = 14;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  UserStatus status = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}

message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional string nickname = 3;
  optional int32 age = 4;
  optional UserStatus status = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message WatchUsersRequest {}

message ImportUsersResponse {
  int32 imported = 1;
}

message ChatMessage {
  string text = 1;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc WatchUsers(WatchUsersRequest) returns (stream User);
  rpc ImportUsers(stream CreateUserRequest) returns (ImportUsersResponse);
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}
